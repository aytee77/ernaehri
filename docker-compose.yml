# Local runs and self-hosting of the published image.
#
#   docker compose up --build                     # build from the local sources
#   docker compose pull && docker compose up      # use the ghcr.io image
#
# Images published by .github/workflows/docker-publish.yml live at
#   ghcr.io/aytee77/ernaehri:latest
#
# Runtime data lives in ./data and ./next-cache next to this file (plain bind
# mounts, no Docker volumes). The container runs as uid/gid 1001, and bind mounts
# get no ownership fix-up, so on Linux those directories must be writable by 1001:
#
#   mkdir -p data/cache next-cache && sudo chown -R 1001:1001 data next-cache
#
# On Docker Desktop (Windows/macOS) the mapped permissions are permissive, so the
# directories are created automatically on first start.

services:
  ernaehri:
    build:
      context: .
    image: ghcr.io/aytee77/ernaehri:latest
    container_name: ernaehri
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Every variable is optional: without them the app runs on its public
    # defaults (Migros/Migusto client keys) and the Bring! export stays off.
    env_file:
      - path: .env.local
        required: false
    volumes:
      # Migros product/price cache (1 week TTL). This is the same host directory
      # that `npm run dev` writes to, so dev and container share one cache.
      - ./data:/app/data
      # Next.js server cache (`use cache`, cacheLife) – keeps generated weeks
      # warm. A separate host directory on purpose: pointing this at the local
      # `.next/` would mix the dev build's cache into the container.
      - ./next-cache:/app/.next/cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
